<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p id="para"></p>
    <button onclick="randomGenerator()">Generate a random no</button>
    <script>
        function randomGenerator(){
            document.getElementById("para").innerHTML= Math.floor(Math.random()*100);
        }
    </script>
    
</body>
</html>
