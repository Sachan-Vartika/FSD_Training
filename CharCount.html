<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>To Count The Characters Written</h3>
    <textarea id="text" onkeyup="CharCount()" placeholder="Enter Text"></textarea>
    <div style="background-color: aqua;">
        <p id="para"> 0</p>
    </div>
    
    <script>
        function CharCount(){
            let text=document.getElementById("text").value;
            document.getElementById("para").innerHTML=text.length;
        }
    </script>
</body>
</html>
